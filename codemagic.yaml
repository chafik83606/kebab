# Kebab Empire — build iOS pour iPhone (Codemagic)
# Docs : https://docs.codemagic.io/yaml-quick-start/building-a-unity-app/
# Install custom Unity version :
# https://docs.codemagic.io/knowledge-others/install-unity-version/

workflows:
  kebab-ios:
    name: Kebab iOS (iPhone)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic-ios-release-v2
    environment:
      # Version supportée Codemagic (licence uniquement). Le build utilise 2022.3.62f3 via Unity Hub.
      unity: 2022.3.62f2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctre2.kebabmanager
      groups:
        - unity_credentials
      vars:
        UNITY_VERSION: 2022.3.62f3
        UNITY_VERSION_CHANGESET: 96770f904ca7
        UNITY_IOS_DIR: Builds/ios
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        BUNDLE_ID: com.ctre2.kebabmanager
    scripts:
      - name: Activate Unity license
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -logFile - \
            -serial ${UNITY_SERIAL?} \
            -username ${UNITY_EMAIL?} \
            -password ${UNITY_PASSWORD?}
      - name: Install Unity 2022.3.62f3 (iOS module)
        script: |
          yes Y | /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless install \
            --version "$UNITY_VERSION" --changeset "$UNITY_VERSION_CHANGESET" -a arm64
          yes Y | /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless install-modules \
            --version "$UNITY_VERSION" -m ios -a arm64
          echo "UNITY_HOME=/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app" >> $CM_ENV
          echo "UNITY_BIN=/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" >> $CM_ENV
      - name: Export Xcode project from Unity
        script: |
          $UNITY_BIN -batchmode -quit -logFile - \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod KebabIosBuild.BuildIosBatch \
            -nographics
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$UNITY_IOS_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Return Unity license
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -returnlicense -nographics || true
    artifacts:
      - build/ios/ipa/*.ipa
