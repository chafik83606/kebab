# Kebab Empire — build iOS pour iPhone (Codemagic)
# Docs : https://docs.codemagic.io/yaml-quick-start/building-a-unity-app/

workflows:
  kebab-ios:
    name: Kebab iOS (iPhone)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic-ios-release-v2
    environment:
      unity: 2022.3.62f3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctre2.kebabmanager
      groups:
        - unity_credentials
      vars:
        UNITY_BIN: $UNITY_HOME/Contents/MacOS/Unity
        UNITY_IOS_DIR: Builds/ios
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        BUNDLE_ID: com.ctre2.kebabmanager
    scripts:
      - name: Activate Unity license
        script: |
          $UNITY_BIN -batchmode -quit -logFile - \
            -serial ${UNITY_SERIAL?} \
            -username ${UNITY_EMAIL?} \
            -password ${UNITY_PASSWORD?}
      - name: Export Xcode project from Unity
        script: |
          $UNITY_BIN -batchmode -quit -logFile - \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod KebabIosBuild.BuildIosBatch \
            -nographics
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$UNITY_IOS_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Return Unity license
        script: |
          $UNITY_BIN -batchmode -quit -returnlicense -nographics || true
    artifacts:
      - build/ios/ipa/*.ipa
